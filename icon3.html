<!DOCTYPE html>
<html>
<body style="background:#e2e8f0; margin:20px; font-family:sans-serif; text-align:center;">

  <div style="margin-bottom:20px;">
    <button onclick="downloadPNG()" style="padding:12px 24px; font-size:16px; cursor:pointer; background:#012169; color:white; border:none; border-radius:8px;">
      Скачать PNG (512×512)
    </button>
  </div>

  <svg id="my-icon" width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://w3.org">
    <defs>
      <clipPath id="icon-bounds"><rect width="512" height="512" rx="64" /></clipPath>
      <clipPath id="left-half"><rect x="0" y="0" width="256" height="512" /></clipPath>
      <clipPath id="right-half"><rect x="256" y="0" width="256" height="512" /></clipPath>
    </defs>
    <g clip-path="url(#icon-bounds)">
      <g clip-path="url(#left-half)">
        <rect width="512" height="512" fill="#012169" />
        <path d="M-50 -50 L562 562 M562 -50 L-50 562" stroke="#FFFFFF" stroke-width="102" />
        <path d="M-50 -50 L256 256" stroke="#C8102E" stroke-width="34" transform="translate(0, 17)" />
        <path d="M-50 562 L256 256" stroke="#C8102E" stroke-width="34" transform="translate(0, -17)" />
        <path d="M256 0 V512 M0 256 H512" stroke="#FFFFFF" stroke-width="170" />
        <path d="M256 0 V512 M0 256 H512" stroke="#C8102E" stroke-width="102" />
      </g>
      <g clip-path="url(#right-half)">
        <rect x="256" y="0" width="256" height="512" fill="#F8FAFC" />
        <path d="M256 184 L440 0 H512 V72 L328 256 L512 440 V512 H440 L256 328" fill="#FFFFFF" stroke="#64748B" stroke-width="10" stroke-linejoin="round" />
        <path d="M256 232 L488 0 M280 256 L512 488" stroke="#64748B" stroke-width="8" />
        <path d="M256 171 H512 V341 H256 V512 H171 V0 H256 V171 Z" fill="#FFFFFF" stroke="#64748B" stroke-width="10" />
        <path d="M256 205 H512 V307 H256 V512 H205 V0 H256 V205 Z" fill="#E2E8F0" stroke="#64748B" stroke-width="8" />
      </g>
      <line x1="256" y1="0" x2="256" y2="512" stroke="#64748B" stroke-width="8" />
      <rect x="5" y="5" width="502" height="502" rx="59" stroke="#64748B" stroke-width="10" />
    </g>
  </svg>

  <script>
    function downloadPNG() {
      const svg = document.getElementById('my-icon');
      const data = new XMLSerializer().serializeToString(svg);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        canvas.getContext('2d').drawImage(img, 0, 0);
        const a = document.createElement('a');
        a.download = 'uk-icon.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      };
      img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(data)));
    }
  </script>
</body>
</html>
