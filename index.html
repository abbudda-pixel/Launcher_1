<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workspace</title>
<style>
:root{--bg:#1e2762;--s:#263175;--sh:#2f3c8c;--b:#3b499e;--t:#f1f5f9;--m:#a5b4fc;--a:#38bdf8;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px 16px 50px}
.w{max-width:1100px;margin:0 auto}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--b);margin-bottom:20px}
.dt{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--a);font-weight:700}
h1{font-size:28px;font-weight:700}
.tabs{display:flex;gap:6px;background:var(--s);padding:4px;border-radius:var(--r);border:1px solid var(--b)}
.tab{background:none;border:none;color:var(--m);padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:500}
.tab.on{background:var(--sh);color:var(--t)}
.srch{width:100%;background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:12px 14px;color:var(--t);font-size:15px;margin-bottom:24px;outline:none}
.srch:focus{border-color:var(--a)}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--m);font-weight:700;margin:22px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.card{display:flex;align-items:center;gap:10px;background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:12px;text-decoration:none;color:var(--t);transition:.15s}
.card:hover{background:var(--sh);border-color:var(--a);transform:translateY(-2px)}
.ico{width:34px;height:34px;border-radius:8px;background:rgba(56,189,248,.16);color:var(--a);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.ico img{width:20px;height:20px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.box{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;background:var(--bg);border-radius:7px;margin-bottom:7px}
.mth{font:700 10px monospace;padding:2px 6px;border-radius:4px;background:rgba(97,175,239,.15);color:#61afef}
.btn{background:var(--s);border:1px solid var(--b);color:var(--m);font-size:11px;padding:4px 8px;border-radius:5px;cursor:pointer}
.btn:hover{color:var(--t);border-color:var(--a)}
.vf{display:flex;gap:6px;margin:8px 0 10px}
.vf input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--b);border-radius:6px;padding:6px 8px;color:var(--t);font-size:12px}
.vf button{background:var(--a);color:#111;border:none;font-weight:600;padding:6px 12px;border-radius:6px;cursor:pointer}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.wcard{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.tag{font-size:11px;background:var(--bg);color:var(--a);padding:2px 7px;border-radius:4px;border:1px solid var(--b);margin-right:5px}
.hide{display:none!important}
.toast{position:fixed;bottom:18px;right:18px;background:var(--sh);border:1px solid var(--a);padding:9px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
.sub{font-size:12px;font-weight:600;margin:14px 0 8px;display:flex;align-items:center;gap:8px;color:var(--t)}
.sub::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.g-biz{color:#fbbf24}.g-zozh{color:#34d399}.g-kids{color:#8fa3cc}
.c-biz{border-left:3px solid #fbbf24}.c-biz .ico{background:rgba(251,191,36,.15);color:#fbbf24}
.c-zozh{border-left:3px solid #34d399}.c-zozh .ico{background:rgba(52,211,153,.15);color:#34d399}
.c-kids{border-left:3px solid #5c729e}
.c-kids .ico{background:rgba(143,163,204,.12);color:#9bb0d9}
</style>
</head>
<body>
<div class="w">
  <header>
    <div><div class="dt" id="dt"></div><h1 id="gr">Workspace</h1></div>
    <div class="tabs">
      <button class="tab on" onclick="sw('d',this)">Дашборд и API</button>
      <button class="tab" onclick="sw('p',this)">Портфолио</button>
    </div>
  </header>
  <input class="srch" id="q" placeholder="Поиск по приложениям, API и проектам (нажмите /)">
  <div id="d">
    <div class="sec">Приложения и сервисы</div>
    <div class="grid" id="apps"></div>
    <div class="sec">Мои AI-продукты</div>
    <div id="ai"></div>
    <div class="sec">API-коллекции и локальный сейф ключей</div>
    <div class="cols">
      <div class="box"><div id="apis"></div></div>
      <div class="box">
        <div style="font-size:12px;color:var(--m)">Ключи хранятся только в памяти этого браузера:</div>
        <form class="vf" id="vf"><input id="kn" placeholder="Сервис" required><input id="kv" type="password" placeholder="API-ключ" required><button>+</button></form>
        <div id="vl"></div>
      </div>
    </div>
  </div>
  <div id="p" class="hide">
    <div class="sec">Избранные работы</div>
    <div class="pgrid" id="port"></div>
  </div>
</div>
<div class="toast" id="ts">Скопировано</div>
<script>
const CFG={
  apps:[
    {n:"GitHub",d:"Репозитории",u:"https://github.com/abbudda-pixel/Launcher_1/tree/main",i:"https://avatars.githubusercontent.com/u/359620157?s=400&u=84b1bd4d3001501bb98b57bb8617163ac41f11e6&v=4"},
    {n:"AI Studio",d:"Модели и API",u:"https://google.com",i:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7ISdc2pCOYOyf3SkSGIq_wd8Pz0pgfSxcXGD7qAG02g&s=10"},
    {n:"Transcript",d:"YouTube",u:"YouTube",i:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_u-SugFZ-Dj20xJy7RVyz7xeYydw29kdiOO2WUrusEw&s=10"},
    {n:"Таблицы",d:"Базы данных",u:"https://google.com",i:"https://jsdelivr.net"},
    {n:"Miro",d:"Схемы",u:"https://miro.com",i:"https://jsdelivr.net"},
    {n:"SmallPDF",d:"Запросы API",u:"https://smallpdf.com/ru#r=app",i:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5SCHnIhAMm6FOQ8Hdl3vkIR8kXPQIsURucwau9h-Lpg&s=10"}
  ],
  ai:[
    {cat:"Бизнес",n:"Трекер обновлений",d:"сайт AntiFraudRussia-2026",u:"https://...",i:"https://jsdelivr.net"},
    {cat:"Бизнес",n:"HeatMap дел.программы",d:"AntiFraudRussia-2025",u:"https://...",i:"https://jsdelivr.net"},
    {cat:"Бизнес",n:"HeatMap вебинара",d:"тест",u:"https://...",i:"https://jsdelivr.net"},
    {cat:"Бизнес",n:"Кувёртковёрт",d:"ДелПрог -> Кувёртки",u:"https://...",i:"https://jsdelivr.net"},
    {cat:"Бизнес",n:"Брифолог",d:"ДелПрог -> Памятка спикеру",u:"https://...",i:"https://jsdelivr.net"},
    {cat:"ЗОЖ",n:"Счётчик калоража",d:"тест",u:"https://...",i:"https://jsdelivr.net"},
    {cat:"ЗОЖ",n:"Велотрени",d:"IC7",u:"https://...",i:"https://jsdelivr.net"},
    {cat:"ЗОЖ",n:"Велотрени",d:"Colnago",u:"https://...",i:"https://jsdelivr.net"},
    {cat:"Детское",n:"Конвертер графики",d:"Контурные флаги",u:"icon3.html",i:"uk-icon.png"}
],
apis:[
    {m:"DOCS",t:"Gemini API",u:"https://google.dev",c:"https://googleapis.com"},
    {m:"POST",t:"Telegram Bot",u:"https://telegram.org",c:"https://telegram.org<TOKEN>/sendMessage"},
    {m:"GET",t:"GitHub REST",u:"https://github.com",c:"https://github.com"}
  ],
  port:[
    {t:"Форум «КВАНТ»",d:"Автор идеи, генеральный продюсер Всероссийского форума по квантовым технологиям, 2022-2025 гг.",g:["Pioneer","Production","Administration"],u:"https://github.com"},
    {t:"ИИ-агент мониторинга",d:"Автоматический трекинг изменений сайтов и отчёты.",g:["AI","Innovations","Production","Automation"],u:"https://github.com"},
    {t:"Фильм «Никто и никогда», Россия-24",d:"Продюсер фильма о строительстве олимпийского газопровода «Джубга-Лазаревское-Сочи», 2012г.",g:["Production","Innovations","Administration"],u:"https://youtu.be/bTjRbIwUSS8?si=uf5AmdM4xgf_-cJU "},
    {t:"Пионер внедрения AI",d:"Первым в России внедрил AI-спикера в программу делового форума, 2022 г.",g:["Pioneer","Innovations","Production","Administration"],u:"https://github.com"},
    {t:"Бизнес-миссия в Египет",d:"Организация деловой программы с участием 4 министров здравоохранения",g:["PR","Production","Administration"],u:"https://github.com"},
    {t:"40+ мероприятий ФЦП «ФАРМА-2020»",d:"Продюсирование и PR и GR-сопровождение проекта",g:["PR","GR","Production","Administration"],u:"https://github.com"},
    {t:"Фестиваль «Мультимир»",d:"Ко-продюсер, 2016-2019 гг.",g:["Pioneer","Production","Administration"],u:"https://github.com"},
    {t:"Конгресс индустрии детских товаров",d:"Продюсер деловой программы, 2017-2019 гг.)",g:["GR","PR","Production","Administration"],u:"https://github.com"},
    {t:"Конференция «МедИнфоБез»",d:"Автор идеи, генеральный продюсер Всероссийской конференции (2022-2025)",g:["Pioneer","Production","Administration"],u:"https://github.com"},
    {t:"Бизнес-миссии в Германию, Китай, Алжир, Казахстан",d:"Организация деловой программы с участием 4 министров здравоохранения",g:["PR","GR","Production"],u:"https://github.com"},
    {t:"Презентация Олимпийского газопровода Президенту РФ",d:"Продюсер мероприятия и уникальных цифровых решений",g:["Innovations","Production","Administration"],u:"https://github.com"},
    {t:"Форум «Россия — спортивная держава»",d:"Продюсер деловой программы, 2016 г.",g:["PR","GR","Production"],u:"https://github.com"},
    {t:"Курс «Креативное письмо»",d:"Автор курса по креативным техникам в писательстве и копирайтинге",g:["Pioneer","Production","Creative"],u:"https://github.com"},
    {t:"Фестиваль «ID в IT»",d:"Автор идеи и концепции профориентационного фестиваля в сфере информационных технологий",g:["Pioneer","Creative"],u:"https://github.com"},
    {t:"IV Российско-Китайское ЭКСПО",d:"Продюсер российской деловой программы, 2017 г., ведущий официальной церемонии открытия российской экспозиции.",g:["Production","B2B","B2G"],u:"https://github.com"}
  ]
};
const $=id=>document.getElementById(id),K="v_keys_1";
function clk(){const n=new Date(),h=n.getHours();$("gr").textContent=h<12?"Доброе утро":h<18?"Добрый день":"Добрый вечер";$("dt").textContent=n.toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"long"})+" • "+n.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}
clk();setInterval(clk,15e3);
function cp(x,m="Скопировано"){navigator.clipboard.writeText(x);$("ts").textContent=m;$("ts").classList.add("on");setTimeout(()=>$("ts").classList.remove("on"),1800)}
function sw(t,b){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on");$("d").classList.toggle("hide",t!=="d");$("p").classList.toggle("hide",t!=="p")}
function ren(f=""){
  const s=f.toLowerCase();
  $("apps").innerHTML=CFG.apps.filter(a=>(a.n+a.d).toLowerCase().includes(s)).map(a=>`<a class="card" href="${a.u}" target="${a.u.startsWith('http')?'_blank':'_self'}"><div class="ico"><img src="${a.i}" onerror="this.remove()"></div><div style="min-width:0"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a.n}</div><div style="font-size:12px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a.d}</div></div></a>`).join("");
  $("apis").innerHTML=CFG.apis.filter(a=>(a.t+a.c).toLowerCase().includes(s)).map(a=>`<div class="row"><div style="display:flex;align-items:center;gap:8px;min-width:0"><span class="mth">${a.m}</span><div style="min-width:0"><a href="${a.u}" target="_blank" style="color:var(--t);text-decoration:none;font-weight:500;display:block">${a.t}</a><div style="font:11px monospace;color:var(--m);overflow:hidden;text-overflow:ellipsis">${a.c}</div></div></div><button class="btn" onclick="cp('${a.c}')">Копия</button></div>`).join("");
  const G=[{k:"Бизнес",c:"biz"},{k:"ЗОЖ",c:"zozh"},{k:"Детское",c:"kids"}];
$("ai").innerHTML=G.map(g=>{
  const it=CFG.ai.filter(a=>a.cat===g.k&&(a.n+a.d+a.cat).toLowerCase().includes(s));
  if(!it.length)return"";
  return`<div class="sub g-${g.c}">${g.k}</div><div class="grid">${it.map(a=>`<a class="card c-${g.c}" href="${a.u}" target="${a.u.startsWith('http')?'_blank':'_self'}"><div class="ico">${a.i?`<img src="${a.i}" onerror="this.remove()">`:a.n}</div><div style="min-width:0"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a.n}</div><div style="font-size:12px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a.d}</div></div></a>`).join("")}</div>`;
}).join("");
  $("port").innerHTML=CFG.port.filter(x=>(x.t+x.d+x.g).toLowerCase().includes(s)).map(x=>`<div class="wcard"><div>${x.g.map(g=>`<span class="tag">${g}</span>`).join("")}</div><h3 style="font-size:16px">${x.t}</h3><p style="font-size:13px;color:var(--m);flex:1">${x.d}</p><a href="${x.u}" target="_blank" class="btn" style="text-align:center;padding:8px;text-decoration:none;color:var(--t)">Открыть →</a></div>`).join("");
  const v=JSON.parse(localStorage.getItem(K)||"[]").filter(x=>x.n.toLowerCase().includes(s));
  $("vl").innerHTML=v.map((x,i)=>`<div class="row"><div><b>${x.n}</b><div style="font:11px monospace;color:var(--m)">••••${x.v.slice(-4)}</div></div><div><button class="btn" onclick="cp('${x.v}','Ключ скопирован')">Ключ</button> <button class="btn" onclick="delK(${i})">✕</button></div></div>`).join("")||`<div style="font-size:12px;color:var(--m)">Ключей пока нет</div>`;
}
window.delK=i=>{const v=JSON.parse(localStorage.getItem(K)||"[]");v.splice(i,1);localStorage.setItem(K,JSON.stringify(v));ren($("q").value)};
$("vf").onsubmit=e=>{e.preventDefault();const v=JSON.parse(localStorage.getItem(K)||"[]");v.push({n:$("kn").value,v:$("kv").value});localStorage.setItem(K,JSON.stringify(v));e.target.reset();ren($("q").value);cp("","Сохранено")};
$("q").oninput=e=>ren(e.target.value);
document.onkeydown=e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();$("q").focus()}};
ren();
</script>
</body>
</html>
